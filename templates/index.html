<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Veterinaria - Registro de Mascotas</title>
</head>
<body>
    <h1>Veterinaria - Mascotas Registradas</h1>

    <form action="/agregar_mascota" method="POST">
        <input type="text" name="nombre" placeholder="Nombre" required>
        <input type="text" name="especie" placeholder="Especie" required>
        <input type="date" name="fecha_nacimiento">
        <button type="submit">Registrar</button>
    </form>

    <hr>

    <table border="1" cellpadding="8">
        <tr>
            <th>ID</th><th>Nombre</th><th>Especie</th><th>Fecha Nac.</th>
        </tr>
        {% for m in mascotas %}
        <tr>
            <td>{{ m.id }}</td>
            <td>{{ m.nombre }}</td>
            <td>{{ m.especie }}</td>
            <td>{{ m.fecha_nacimiento }}</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
